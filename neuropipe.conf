# NeuroPipe Broker Configuration
# ================================
# Uncomment and modify values to override defaults.
# Lines starting with # are comments.

[server]
port = 9092

[limits]
# Maximum size of a single message in bytes (default: 1MB)
# max_message_size = 1048576

# Maximum subscribers per topic (0 = unlimited)
# max_subscribers_per_topic = 0

[logging]
# Log levels: DEBUG, INFO, WARN, ERROR
log_level = INFO

# Log format: text (human-readable) or json (machine-parseable)
# log_format = text
